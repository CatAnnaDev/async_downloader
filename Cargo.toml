[package]
name = "async_downloader"
version = "0.1.0"
edition = "2024"
authors = ["CatAnnaDev"]
description = "Async file downloader: prespawned worker pool, queue with concurrency limit, pause/resume, HTTP range resume, SHA-256 verification, with optional egui and iced integrations."
license = "Unlicense"
repository = "https://github.com/CatAnnaDev/async_downloader"
keywords = ["async", "download", "egui", "iced", "tokio"]
categories = ["asynchronous", "gui"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "async_downloader"
path = "src/lib.rs"

[features]
default = ["egui"]
egui = ["dep:egui"]
iced = ["dep:iced", "dep:tokio-stream"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "net", "time", "sync"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.11.0"
async-channel = "2"
egui = { version = "0.34", optional = true }
iced = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[dev-dependencies]
eframe = "0.34"

[[example]]
name = "egui_app"
required-features = ["egui"]

[[example]]
name = "iced_app"
required-features = ["iced"]
